<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Limitless | Em Construção</title>

  <!-- Tipografia sofisticada estilo alta relojoaria -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: 'Cormorant Garamond', serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .brand {
      font-size: 12px;
      letter-spacing: 8px;
      text-transform: uppercase;
      font-weight: 400;
      opacity: 0.7;
    }

    h1 {
      font-size: 54px;
      font-weight: 300;
      letter-spacing: 2px;
      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.08),
        0 8px 24px rgba(0, 0, 0, 0.05);
      filter: blur(0.3px);
    }

    h2 {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow:
        0 2px 6px rgba(0, 0, 0, 0.06);
      filter: blur(0.2px);
      opacity: 0.85;
    }

    .limitless {
      font-size: 14px;
      letter-spacing: 12px;
      text-transform: uppercase;
      margin-top: 10px;
      text-shadow:
        0 4px 20px rgba(0, 0, 0, 0.12);
      filter: blur(0.4px);
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      h1 { font-size: 38px; }
      h2 { font-size: 16px; }
      .limitless { font-size: 12px; letter-spacing: 8px; }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="brand">LIMITLESS</div>
    <h1>Em construção</h1>
    <h2>Não haverá limite</h2>
    <div class="limitless">LIMITLESS</div>
  </div>
</body>
</html>
